  <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
  
  <header class="header_1">
    
    
    <a href="index.html" >
      <img class="LOGO_1"
      src="JACO_LOGO.png" alt="JACO_TRADES_LOGO">
    </a>

    <a href="index.html" class="nav_link"><h3 class="header_buttons active">WYNIKI</h3></a>

    
    <a href="index.html" class="nav_link"><h3 class="header_buttons">IDK_1</h3></a>
    

    <a href="index.html" class="nav_link"><h3 class="header_buttons">IDK_2</h3></a>
  
  </header>


  <section class="inside">
    <div class="content p-3">
    <div class="row">

        <div class="col-3">
            <div id="leagues-list" class="card text-bg-dark border-dark">
                <div class="card-body p-0">
                    <api-sports-widget data-type="leagues"></api-sports-widget>
                </div>
            </div>
        </div>

        <div class="col-5">
            <div id="games-list" class="card text-bg-dark border-dark">
                <div class="card-body p-0">
                    <div id="games-list">
                        <api-sports-widget data-type="games"></api-sports-widget>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-4">

            <!-- Start Dynamic Targeting containers -->
            <div class="card text-bg-dark border-dark">
                <div class="card-body p-0">
                    <div id="standings-content"></div>
                </div>
            </div>
            <div class="card text-bg-dark border-dark">
                <div class="card-body p-0">
                    <div id="team-content"></div>
                </div>
            </div>
            <!-- End Dynamic Targeting containers -->

            <div id="game-content" class="card text-bg-dark border-dark">
                <div class="card-body p-0">
                    <api-sports-widget data-type="game" data-game-id="977705"></api-sports-widget>
                </div>
            </div>

        </div>

    </div>
</div>



<api-sports-widget 
    data-type="config" 
    data-sport="football" 
    data-key="f5b949ef190d9ff30258ae4c943e7abf"
    data-lang="en" 
    data-theme="grey" 
    data-show-error="false" 
    data-show-logos="true"
    data-refresh="20" 
    data-favorite="true" 
    data-player-trophies="true" 
    data-standings="true"
    data-player-injuries="true"
    data-team-squad="true" 
    data-team-statistics="true" 
    data-player-statistics="true"
    data-tab="games"
    data-game-tab="statistics"
    data-target-player="modal" 
    data-target-league="#games-list" 
    data-target-team="#team-content" 
    data-target-game="#game-content .card-body" 
    data-target-standings="#standings-content"
  ></api-sports-widget>
  </section>
